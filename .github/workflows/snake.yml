# 🐍 Snake Animation - Gera a cobrinha que come os commits
# Esse workflow roda automaticamente a cada 12 horas e também pode ser acionado manualmente

name: Generate Snake Animation

on:
  schedule:
    # Roda a cada 12 horas automaticamente
    - cron: "0 */12 * * *"
  workflow_dispatch:
    # Permite rodar manualmente pelo GitHub Actions

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Gera os SVGs da cobrinha a partir do gráfico de contribuições
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Faz push dos SVGs gerados para a branch "output"
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
